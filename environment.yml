# Conda environment for the GGM codebase.
#
# This file creates the interpreter only. Packages are installed with pip
# afterwards, in this order:
#
#   conda env create -f environment.yml
#   conda activate GGM_env
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
#   pip install -r requirements.txt
#
# The order matters. requirements.txt contains packages that depend on torch
# (timm in particular), so installing it first would pull a default PyTorch
# wheel from PyPI instead of the CUDA build selected above. For the same reason
# torch is not pinned through conda: the pytorch conda channel no longer
# publishes current builds, and no single CUDA build covers every supported GPU
# generation. See the Installation section of README.md.

name: GGM_env
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - setuptools
  - wheel
